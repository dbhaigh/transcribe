name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configure with tests
        run: cmake -S . -B build -DTRANSCRIBE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Build WebView2 GUI
        shell: pwsh
        run: |
          $version = "1.0.4258.31"
          $package = "$env:RUNNER_TEMP\Microsoft.Web.WebView2.zip"
          $sdk = "$env:RUNNER_TEMP\webview2-sdk"
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Invoke-WebRequest `
            -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$version/microsoft.web.webview2.$version.nupkg" `
            -OutFile $package
          Expand-Archive -Path $package -DestinationPath $sdk -Force
          cmake -S . -B build-webview2 `
            -DTRANSCRIBE_ENABLE_WEBVIEW2=ON `
            -DTRANSCRIBE_WEBVIEW2_SDK_ROOT="$sdk"
          cmake --build build-webview2 --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-windows
          path: build/evaluation/*
          if-no-files-found: error
      - name: Package WebView2 workstation
        run: cpack --config build-webview2\CPackConfig.cmake -G ZIP -C Release -B build-webview2\packages
      - uses: actions/upload-artifact@v4
        with:
          name: transcriber-windows-webview2
          path: build-webview2/packages/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        ffmpeg: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pkg-config libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Release
          -DTRANSCRIBE_ENABLE_FFMPEG=${{ matrix.ffmpeg }}
          -DTRANSCRIBE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-linux-${{ matrix.compiler }}-ffmpeg-${{ matrix.ffmpeg }}
          path: build/evaluation/*
          if-no-files-found: error
      - name: Decode a compressed fixture
        if: matrix.ffmpeg == 'ON'
        run: |
          ffmpeg -nostdin -hide_banner -loglevel error -y -i samples/single_a4.wav -c:a flac "$RUNNER_TEMP/single_a4.flac"
          ./build/transcriber "$RUNNER_TEMP/single_a4.flac" --quiet --musicxml "$RUNNER_TEMP/score.musicxml" --tab "$RUNNER_TEMP/tab.txt"
      - name: Package CLI
        run: cpack --config build/CPackConfig.cmake -G TGZ -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: transcriber-linux-${{ matrix.compiler }}-ffmpeg-${{ matrix.ffmpeg }}
          path: build/packages/*
          if-no-files-found: error

  onnx:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set ONNX Runtime environment
        run: |
          echo "ONNXRUNTIME_ROOT=$RUNNER_TEMP/onnxruntime-linux-x64-1.20.1" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/onnxruntime-linux-x64-1.20.1/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Download ONNX Runtime
        run: |
          curl -fsSL https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz -o "$RUNNER_TEMP/onnxruntime.tgz"
          tar -xzf "$RUNNER_TEMP/onnxruntime.tgz" -C "$RUNNER_TEMP"
      - name: Configure
        run: >-
          cmake -S . -B build
          -DTRANSCRIBE_ENABLE_ONNX=ON
          -DCMAKE_BUILD_TYPE=Release
          -DTRANSCRIBE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-onnx-build
          path: build/evaluation/*
          if-no-files-found: error
